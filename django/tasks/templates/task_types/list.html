{% extends 'layout.html' %} {% load i18n static %} 

{% block title %}{% trans 'Task Types' %}{% endblock title %} 

{% block page-title %}
<i class="bi bi-award mx-2"></i>
{% trans 'Task Types' %} 
{% endblock page-title %}

{% block breadcrumb %}
<c-breadcrumb-link href="{% url 'task_types:list' %}" icon="bi bi-award" title="{% trans 'Task Types'%}" ></c-breadcrumb-link>
{% endblock breadcrumb %}

{% block content %}

<div
  class="stats shadow mx-3 my-2"
  hx-get="{% url 'task_types:stats' %}"
  hx-trigger="load, refresh"
  hx-swap="innerHTML"
>
</div>

<div class="flex justify-end mb-2">
  <button 
    class="btn btn-success"
    onclick="modal.showModal()"
    hx-get="{% url 'task_types:create' %}"
    hx-target="#modal-content"
    hx-swap="innerHTML"
  >
    <i class="bi bi-plus mr-2"></i>
    {% trans 'New Task Type' %}
  </button>
</div>

<c-table 
  :headers="['{% trans 'Description'%}', '{% trans 'Base Value'%}']"
  trigger="load, refreshClients"
  swap="innerHTML"
  url="{% url 'task_types:htmx' %}?page={{ page_obj.number }}"
  app_htmx_url={% url 'clients:htmx' %}
  :attrs="page-obj"
/>

<c-modal />
<script>
  document.addEventListener("DOMContentLoaded", function () {

    document.body.addEventListener("htmx:afterRequest", function (event) {
      if (event.detail.xhr.status == 200 && event.detail.elt.tagName == "DIV") {
        console.log(event.detail.elt);
        htmx.trigger("#tbody", "refreshClients");
      }
    });

    document.body.addEventListener('closeModal', function() {
        document.getElementById('modal').close();
    });

  });
</script>
{% endblock content %}
